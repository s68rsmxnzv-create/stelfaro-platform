server {
    server_name new.stelfaro.com;

    root /var/www/stelfaro-platform-api/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    # Retira cookies compartidas creadas antes de consolidar la plataforma en este host.
    add_header Set-Cookie "stelfaro-session=; Path=/; Domain=.stelfaro.com; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    add_header Set-Cookie "XSRF-TOKEN=; Path=/; Domain=.stelfaro.com; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; Secure; SameSite=Lax" always;
    charset utf-8;

    location ^~ /notifications-api/ {
        rewrite ^/notifications-api/(.*)$ /api/$1 break;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/stelfaro-notifications/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/stelfaro-notifications/public;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ^~ /administracion/ {
        try_files $uri $uri/ /administracion/index.html;
    }

    location /core-api/ {
        proxy_pass http://127.0.0.1:8181/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/new.stelfaro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.stelfaro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name new.stelfaro.com;
    return 301 https://$host$request_uri;
}
